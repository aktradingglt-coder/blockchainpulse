name: live-smoke

# Nightly: re-fetch every keyless provider's recording plan live and compare response shapes with the committed
# cassettes. Fails (and alerts through the normal failed-workflow notification) on schema drift or provider errors.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.32"
      - run: uv python install 3.12.13
      - run: uv sync --frozen --all-packages
      - name: live schema-drift check
        env:
          SEC_EDGAR_USER_AGENT: "ResearchDesk-CI (working name) support@example.com"
        run: uv run python -m rd_data.recording --check-drift --providers cftc,sec_edgar,us_treasury,kraken_futures
