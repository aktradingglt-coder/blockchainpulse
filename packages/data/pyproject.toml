[project]
name = "rd-data"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rd-core",
    "httpx==0.28.1",
    "redis==8.1.0",
    "pandas==3.0.6",
    "numpy==2.5.4",
    "exchange-calendars==4.13.2",
    "ccxt==4.5.89",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rd_data"

[tool.uv.sources]
rd-core = { workspace = true }
