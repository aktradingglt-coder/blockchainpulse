[project]
name = "rd-db"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rd-core",
    "sqlalchemy[asyncio]==2.1.5",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rd_db"

[tool.uv.sources]
rd-core = { workspace = true }
