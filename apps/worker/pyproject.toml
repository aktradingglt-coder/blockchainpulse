[project]
name = "rd-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rd-core",
    "rd-db",
    "dramatiq[redis]==2.2.1",
    "redis==8.1.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rd_worker"

[tool.uv.sources]
rd-core = { workspace = true }
rd-db = { workspace = true }
